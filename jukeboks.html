<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Jukeboks</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    height:100vh;
    overflow:hidden;
    background:#111;
    color:white;
    font-family:Arial,sans-serif;

    display:grid;
    grid-template-columns:1fr 300px 1fr;
}

#leftPanel,
#rightPanel{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    padding:10px;
}

#centerPanel{
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

#cover{
    width:260px;
    height:260px;
    border-radius:20px;
    background-size:cover;
    background-position:center;
    background-image:url('ventesang.jpg');

    box-shadow:0 0 25px rgba(255,255,255,.25);
}

#status{
    margin-top:20px;
    text-align:center;
    font-size:24px;
}

.song{
    border:none;
    border-radius:15px;

    background:#2a2a2a;
    color:white;

    font-size:22px;
    font-weight:bold;

    cursor:pointer;

    transition:.2s;
}

.song:hover{
    background:#444;
}

.song.active{
    background:#0d8f3f;
}

</style>
</head>

<body>

<div id="leftPanel"></div>

<div id="centerPanel">

    <div id="cover"></div>

    <div id="status">
        Ventesang spiller
    </div>

</div>

<div id="rightPanel"></div>

<script>

const waitingSong  = "ventesang.mp3";
const waitingCover = "ventesang.jpg";

const player = new Audio();
const waitingPlayer = new Audio(waitingSong);

waitingPlayer.loop = true;

const cover  = document.getElementById("cover");
const status = document.getElementById("status");

function setCover(image)
{
    cover.style.backgroundImage =
        `url('${image}')`;
}

function clearSelection()
{
    document
        .querySelectorAll(".song")
        .forEach(btn =>
            btn.classList.remove("active"));
}

function startWaitingSong()
{
    player.pause();

    waitingPlayer.currentTime = 0;
    waitingPlayer.play();

    setCover(waitingCover);

    status.textContent =
        "Ventesang spiller";

    clearSelection();
}

function playSong(songNumber)
{
    waitingPlayer.pause();

    player.pause();
    player.currentTime = 0;

    player.src =
        `sang${songNumber}.mp3`;

    player.play();

    setCover(
        `sang${songNumber}.jpg`
    );

    status.textContent =
        `Sang ${songNumber}`;

    clearSelection();

    document
        .getElementById(
            "song"+songNumber
        )
        .classList.add(
            "active"
        );
}

player.addEventListener(
    "ended",
    startWaitingSong
);

const leftPanel =
    document.getElementById(
        "leftPanel"
    );

const rightPanel =
    document.getElementById(
        "rightPanel"
    );

for(let i=1;i<=10;i++)
{
    const btn =
        document.createElement(
            "button"
        );

    btn.className =
        "song";

    btn.id =
        "song"+i;

    btn.textContent =
        "Sang "+i;

    btn.onclick =
        () => playSong(i);

    leftPanel.appendChild(btn);
}

for(let i=11;i<=20;i++)
{
    const btn =
        document.createElement(
            "button"
        );

    btn.className =
        "song";

    btn.id =
        "song"+i;

    btn.textContent =
        "Sang "+i;

    btn.onclick =
        () => playSong(i);

    rightPanel.appendChild(btn);
}

startWaitingSong();

</script>

</body>
</html>
