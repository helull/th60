<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spotify Jukeboks</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#121212;
    color:white;
    margin:0;
    padding:30px;
}

h1{
    text-align:center;
    color:#1DB954;
}

.jukebox{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:15px;
    max-width:1000px;
    margin:auto;
}

.song{
    background:#1e1e1e;
    padding:20px;
    border-radius:10px;
    cursor:pointer;
    transition:.2s;
}

.song:hover{
    background:#2a2a2a;
    transform:scale(1.03);
}

.song h3{
    margin:0;
}

.player{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    background:#000;
    padding:10px;
}

iframe{
    width:100%;
    height:152px;
    border:none;
}
</style>
</head>

<body>

<h1>🎵 Min Spotify Jukeboks</h1>

<div class="jukebox">

    <div class="song"
         onclick="playTrack('4uLU6hMCjMI75M1A2tKUQC')">
        <h3>Never Gonna Give You Up</h3>
        <p>Rick Astley</p>
    </div>

    <div class="song"
         onclick="playTrack('0VjIjW4GlUZAMYd2vXMi3b')">
        <h3>Blinding Lights</h3>
        <p>The Weeknd</p>
    </div>

    <div class="song"
         onclick="playTrack('2takcwOaAZWiXQijPHIx7B')">
        <h3>Take On Me</h3>
        <p>A-ha</p>
    </div>

</div>

<div class="player">
    <iframe
        id="spotifyPlayer"
        src="https://open.spotify.com/embed/track/4uLU6hMCjMI75M1A2tKUQC"
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; pictureopen.spotify.com/embed/track/" + trackId;
}
</script>

</body>
</html>
