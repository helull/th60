<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Jukeboks</title>

    <style>
        body {
            background: #121212;
            color: white;
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #1DB954;
        }

        #currentSong {
            text-align: center;
            margin: 20px 0;
            font-size: 20px;
        }

        .songs {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
        }

        .song {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 10px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: 0.2s;
        }

        .song:hover {
            background: #2a2a2a;
        }

        .song.active {
            border-color: #1DB954;
        }

        #spotifyPlayer {
            width: 100%;
            height: 152px;
            border: none;
            margin-top: 25px;
            border-radius: 12px;
        }
    </style>
</head>

<body>

<h1>🎵 Spotify Jukeboks</h1>

<div id="currentSong">
    Nå valgt: Never Gonna Give You Up
</div>

<div class="songs">

    <div class="song active"
         data-id="4uLU6hMCjMI75M1A2tKUQC"
         data-title="Never Gonna Give You Up">
        <h3>Never Gonna Give You Up</h3>
        <p>Rick Astley</p>
    </div>

    <div class="song"
         data-id="0VjIjW4GlUZAMYd2vXMi3b"
         data-title="Blinding Lights">
        <h3>Blinding Lights</h3>
        <p>The Weeknd</p>
    </div>

    <div class="song"
         data-id="2takcwOaAZWiXQijPHIx7B"
         data-title="Take On Me">
        <h3>Take On Me</h3>
        <p>A-ha</p>
    </div>

</div>

https://open.spotify.com/embed/track/4uLU6hMCjMI75M1A2tKUQC
</iframe>

<script>

document.querySelectorAll('.song').forEach(song => {

    song.addEventListener('click', () => {

        const trackId = song.dataset.id;
        const title = song.dataset.title;

        document.getElementById('spotifyPlayer').src =
            'https://open.spotify.com/embed/track/' + trackId;

        document.getElementById('currentSong').textContent =
            'Nå valgt: ' + title;

        document.querySelectorAll('.song').forEach(s =>
            s.classList.remove('active')
        );

        song.classList.add('active');
    });

});

</script>

</body>
</html>
