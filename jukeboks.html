<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spotify Jukeboks</title>

<style>
body {
    margin: 0;
    padding: 30px;
    background: #121212;
    color: white;
    font-family: Arial, sans-serif;
}

h1 {
    text-align: center;
    color: #1DB954;
}

#currentSong {
    text-align: center;
    font-size: 22px;
    margin: 20px 0;
}

.jukebox {
    max-width: 900px;
    margin: auto;
    display: grid;
    grid-template-columns: repeat(auto-fit,minmax(220px,1fr));
    gap: 15px;
}

.song {
    background: #1e1e1e;
    border-radius: 12px;
    padding: 20px;
    cursor: pointer;
    transition: 0.2s;
    border: 2px solid transparent;
}

.song:hover {
    background: #2b2b2b;
    transform: scale(1.03);
}

.song.active {
    border-color: #1DB954;
}

.song h3 {
    margin-top: 0;
}

.player {
    max-width: 900px;
    margin: 30px auto;
}

#spotifyPlayer {
    width: 100%;
    height: 152px;
    border: none;
    border-radius: 12px;
}
</style>
</head>

<body>

<h1>🎵 Spotify Jukeboks</h1>

<div id="currentSong">
Nå valgt: Never Gonna Give You Up
</div>

<div class="jukebox">

<div class="song active"
     onclick="playTrack(this,'4uLU6hMCjMI75M1A2tKUQC','Never Gonna Give You Up')">
    <h3>Never Gonna Give You Up</h3>
    <p>Rick Astley</p>
</div>

<div class="song"
     onclick="playTrack(this,'0VjIjW4GlUZAMYd2vXMi3b','Blinding Lights')">
    <h3>Blinding Lights</h3>
    <p>The Weeknd</p>
</div>

<div class="song"
     onclick="playTrack(this,'2takcwOaAZWiXQijPHIx7B','Take On Me')">
    <h3>Take On Me</h3>
    <p>A-ha</p>
</div>

</div>

<div class="player">

</body>
</html>
