<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spotify Jukeboks</title>

<style>
body {
    background: #121212;
    color: white;
    font-family: Arial, sans-serif;
    max-width: 900px;
    margin: auto;
    padding: 20px;
}

h1 {
    text-align: center;
    color: #1DB954;
}

#current {
    text-align: center;
    font-size: 20px;
    margin-bottom: 20px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 12px;
}

.card {
    background: #1e1e1e;
    padding: 16px;
    border-radius: 10px;
    cursor: pointer;
    border: 2px solid transparent;
    transition: 0.2s;
}

.card:hover {
    background: #2a2a2a;
}

.card.active {
    border-color: #1DB954;
}

.card h3 {
    margin-top: 0;
}

iframe {
    width: 100%;
    height: 152px;
    border: none;
    border-radius: 12px;
    margin-top: 20px;
}
</style>
</head>

<body>

<h1>🎵 Spotify Jukeboks</h1>

<div id="current">
    Nå valgt: Never Gonna Give You Up
</div>

<div class="grid">

    <div class="card active"
         data-id="4uLU6hMCjMI75M1A2tKUQC"
         data-title="Never Gonna Give You Up">
        <h3>Never Gonna Give You Up</h3>
        <p>Rick Astley</p>
    </div>

    <div class="card"
         data-id="0VjIjW4GlUZAMYd2vXMi3b"
         data-title="Blinding Lights">
        <h3>Blinding Lights</h3>
        <p>The Weeknd</p>
    </div>

    <div class="card"
         data-id="2takcwOaAZWiXQijPHIx7B"
         data-title="Take On Me">
        <h3>Take On Me</h3>
        <p>A-ha</p>
    </div>

</div>

https://open.spotify.com/embed/track/4uLU6hMCjMI75M1A2tKUQC
</iframe>

<script>

const cards = document.querySelectorAll(".card");
const player = document.getElementById("spotifyPlayer");
const current = document.getElementById("current");

cards.forEach(card => {

    card.addEventListener("click", () => {

        const trackId = card.dataset.id;
        const title = card.dataset.title;

        player.src =
            "https://open.spotify.com/embed/track/" + trackId;

        current.textContent =
            "Nå valgt: " + title;

        cards.forEach(c => c.classList.remove("active"));

        card.classList.add("active");
    });

});

</script>

</body>
</html>
