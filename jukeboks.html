<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Jukeboks</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
    overflow:hidden;
}

h1{
    text-align:center;
    margin:10px;
    color:#ffd700;
}

#status{
    text-align:center;
    margin-bottom:10px;
    font-size:20px;
}

.jukebox{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:12px;
    padding:12px;
    height:calc(100vh - 100px);
}

.song{
    position:relative;
    border:none;
    border-radius:15px;
    color:white;
    font-size:28px;
    font-weight:bold;
    cursor:pointer;
    background:#303030;
    min-height:220px;
    overflow:hidden;
}

.song:hover{
    transform:scale(1.02);
}

.song::before{
    content:"";
    position:absolute;
    inset:0;
    opacity:0;
    background-size:cover;
    background-position:center;
    transition:0.3s;
}

.song.active::before{
    opacity:0.45;
}

.song span{
    position:relative;
    z-index:2;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100%;
    text-shadow:2px 2px 5px black;
}

</style>
</head>
<body>

<h1>🎵 Jukeboks</h1>

<div id="status">
Velg en sang
</div>

<div class="jukebox">

<button class="song"
        data-song="sang1.mp3"
        data-cover="sang1.jpg">
    <span>Sang 1</span>
</button>

<button class="song"
        data-song="sang2.mp3"
        data-cover="sang2.jpg">
    <span>Sang 2</span>
</button>

<button class="song"
        data-song="sang3.mp3"
        data-cover="sang3.jpg">
    <span>Sang 3</span>
</button>

</div>

<script>

const waitingSong = "ventesang.mp3";

const player = new Audio();
const waitingPlayer = new Audio(waitingSong);

waitingPlayer.loop = true;

function startWaitingSong()
{
    player.pause();

    waitingPlayer.currentTime = 0;
    waitingPlayer.play();

    document.getElementById("status").innerText =
        "Ventesang spiller";
}

function playSong(songFile, coverFile, button)
{
    waitingPlayer.pause();

    player.pause();
    player.currentTime = 0;

    player.src = songFile;
    player.play();

    document.getElementById("status").innerText =
        songFile;

    document
        .querySelectorAll(".song")
        .forEach(btn => btn.classList.remove("active"));

    button.classList.add("active");

    button.style.setProperty(
        "--cover",
        `url(${coverFile})`
    );

    button.style.backgroundImage =
        `url(${coverFile})`;

    button.style.backgroundSize =
        "cover";

    button.style.backgroundPosition =
        "center";
}

document
.querySelectorAll(".song")
.forEach(button =>
{
    button.addEventListener("click", () =>
    {
        playSong(
            button.dataset.song,
            button.dataset.cover,
            button
        );
    });
});

player.addEventListener("ended", () =>
{
    document
        .querySelectorAll(".song")
        .forEach(btn =>
            btn.classList.remove("active"));

    startWaitingSong();
});

startWaitingSong();

</script>

</body>
</html>
