<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Låst Teksteditor</title>

<style>

html,body{
    margin:0;
    padding:0;
    height:100%;
    background:#111;
    color:white;
    overflow:hidden;
    font-family:Segoe UI, Arial, sans-serif;
}

#toolbar{
    height:55px;
    background:#222;
    display:flex;
    align-items:center;
    gap:10px;
    padding:0 15px;
    box-sizing:border-box;
}

#editor{
    width:100%;
    height:calc(100% - 55px);
    background:#111;
    color:white;
    border:none;
    outline:none;
    resize:none;
    padding:20px;
    font-size:22px;
    box-sizing:border-box;
}

button{
    padding:8px 16px;
    cursor:pointer;
}

#overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.85);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:9999;
}

#dialog{
    background:#222;
    padding:30px;
    border-radius:10px;
    min-width:300px;
}

#dialog h2{
    margin-top:0;
}

#password{
    width:100%;
    padding:10px;
    font-size:18px;
    box-sizing:border-box;
}

#msg{
    color:#ff8080;
    margin-top:10px;
}

</style>
</head>

<body>

<div id="toolbar">
    <button id="fsBtn">
        Fullskjerm
    </button>

    <span>
        Teksteditor
    </span>
</div>

<textarea id="editor"></textarea>

<div id="overlay">

    <div id="dialog">

        <h2>Forlat fullskjerm?</h2>

        <p>
            Skriv passord for å avslutte.
        </p>

        <input
            id="password"
            type="password"
            autocomplete="off">

        <br><br>

        <button onclick="checkPassword()">
            OK
        </button>

        <div id="msg"></div>

    </div>

</div>

<script>

const PASSWORD = "1234";

const editor = document.getElementById("editor");
const overlay = document.getElementById("overlay");
const passwordBox = document.getElementById("password");
const msg = document.getElementById("msg");

let allowExit = false;

function saveText() {
    localStorage.setItem(
        "editor_text",
        editor.value
    );
}

function loadText() {

    const text =
        localStorage.getItem(
            "editor_text"
        );

    if(text){
        editor.value = text;
    }
}

editor.addEventListener(
    "input",
    saveText
);

loadText();

async function enterFullscreen() {

    try {

        if (!document.fullscreenElement) {

            await document
                .documentElement
                .requestFullscreen();

        }

    }
    catch(err){
        console.log(err);
    }

}

document
.getElementById("fsBtn")
.addEventListener(
    "click",
    enterFullscreen
);

window.addEventListener(
    "load",
    () => {
        setTimeout(
            enterFullscreen,
            500
        );
    }
);

document.addEventListener(
    "fullscreenchange",
    async () => {

        if(
            !document.fullscreenElement &&
            !allowExit
        ){

            overlay.style.display =
                "flex";

            passwordBox.value = "";
            passwordBox.focus();

        }

    }
);

function checkPassword(){

    if(
        passwordBox.value === PASSWORD
    ){

        allowExit = true;

        overlay.style.display =
            "none";

        msg.innerHTML = "";

        alert(
            "Fullskjermmodus avsluttet."
        );

    }
    else{

        msg.innerHTML =
            "Feil passord";

        overlay.style.display =
            "none";

        setTimeout(() => {

            enterFullscreen();

        }, 100);

    }

}

document.addEventListener(
    "keydown",
    function(e){

        const k =
            e.key.toLowerCase();

        if(
            e.key === "F12" ||
            e.key === "Escape"
        ){
            e.preventDefault();
            e.stopPropagation();
        }

        if(
            e.ctrlKey &&
            e.shiftKey &&
            (
                k === "i" ||
                k === "j" ||
                k === "c"
            )
        ){
            e.preventDefault();
            e.stopPropagation();
        }

        if(
            e.ctrlKey &&
            (
                k === "u" ||
                k === "s" ||
                k === "o" ||
                k === "p"
            )
        ){
            e.preventDefault();
            e.stopPropagation();
        }

    }
);

document.addEventListener(
    "contextmenu",
    function(e){
        e.preventDefault();
    }
);

window.addEventListener(
    "beforeunload",
    function(e){
        e.preventDefault();
        e.returnValue = "";
    }
);

</script>

</body>
</html>
